services:
  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672 #UI manager
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    env_file:
      - ./.env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - gdash-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - ./.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - gdash-network
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build: ./python-collector
    container_name: collector
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - AMQP_URL=${AMQP_URL}
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
    networks:
      - gdash-network

  queue:
    build: ./queue
    container_name: queue
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - AMQP_URL=${AMQP_URL}
      - BACKEND_API_URL=${BACKEND_API_URL}
    networks:
      - gdash-network

  api:
    build: ./backend
    container_name: api
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      queue:
        condition: service_started # Depends on queue service logic
    env_file:
      - ./.env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=${API_PORT}
    networks:
      - gdash-network
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    env_file:
      - ./.env
    environment:
      - VITE_BACKEND_API_URL=${BACKEND_API_URL}
    networks:
      - gdash-network

networks:
  gdash-network:
    driver: bridge

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  mongo-data:
    driver: local
  mongo-config:
    driver: local
