services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"  # AMQP protocol
      - "15672:15672" # Management UI
    env_file:
      - ./.env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - gdash-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - ./.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - gdash-network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build: ./python-collector
    container_name: collector
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - AMQP_URL=${AMQP_URL}
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
    networks:
      - gdash-network

  queue:
    build: ./queue
    container_name: queue
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - AMQP_URL=${AMQP_URL}
      - BACKEND_API_URL=${BACKEND_API_URL}
    networks:
      - gdash-network

  api:
    build: ./backend
    container_name: api
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      queue:
        condition: service_started # Depends on queue service logic
    env_file:
      - ./.env
    environment:
      - AMQP_URL=${AMQP_URL}
      - MONGODB_URI=${MONGODB_URI}
      - PORT=${API_PORT}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - gdash-network
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    env_file:
      - ./.env
    environment:
      - VITE_BACKEND_API_URL=${BACKEND_API_URL}
    networks:
      - gdash-network

networks:
  gdash-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
